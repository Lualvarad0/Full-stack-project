<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Nudo · Facturas, gastos y SRI en orden</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nudo: facturación, ingresos, gastos personales y control tributario con el SRI para personas con RUC en Ecuador."
    />
    <meta name="theme-color" content="#072a33" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Manrope:wght@500;600&family=Cabin:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo claro/oscuro.
      try {
        var sesion = JSON.parse(sessionStorage.getItem('sesion') || 'null');
        var claveTema =
          sesion && sesion.usuario ? 'tema:usuario:' + sesion.usuario.id : 'tema:publico';
        var tema = localStorage.getItem(claveTema);
        if (tema !== 'light' && tema !== 'dark') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = tema;
        var id = sesion && sesion.usuario ? 'usuario:' + sesion.usuario.id : 'publico';
        document.documentElement.dataset.texto = localStorage.getItem('texto:' + id) === 'grande' ? 'grande' : 'normal';
        document.documentElement.dataset.movimiento =
          localStorage.getItem('movimiento:' + id) === 'reducido' ? 'reducido' : 'normal';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
