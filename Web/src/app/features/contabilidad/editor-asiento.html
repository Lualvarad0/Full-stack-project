<section class="card p-5 space-y-4">
  <h2 class="font-semibold">
    {{ asiento() ? 'Editar borrador #' + asiento()!.id : 'Nuevo asiento' }}
  </h2>
  <div class="grid gap-3 md:grid-cols-[180px_1fr]">
    <label>Fecha<app-selector-fecha [(ngModel)]="fecha" /></label>
    <label>Concepto<input class="input" maxlength="500" [(ngModel)]="concepto" /></label>
  </div>
  <div class="overflow-x-auto">
    <table class="tabla w-full">
      <thead>
        <tr>
          <th>Cuenta</th>
          <th>Debe</th>
          <th>Haber</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (l of lineas(); track $index; let i = $index) {
          <tr>
            <td>
              <select
                class="input"
                [ngModel]="l.cuentaId"
                (ngModelChange)="campo(i, 'cuentaId', $event)"
              >
                <option [ngValue]="0">Elige cuenta</option>
                @for (c of cuentas(); track c.id) {
                  <option [ngValue]="c.id">{{ c.codigo }} · {{ c.nombre }}</option>
                }
              </select>
            </td>
            <td>
              <input
                class="input"
                type="number"
                min="0"
                max="999999999"
                step="0.01"
                aria-label="Debe"
                [ngModel]="l.debe"
                (ngModelChange)="campo(i, 'debe', $event)"
              />
            </td>
            <td>
              <input
                class="input"
                type="number"
                min="0"
                max="999999999"
                step="0.01"
                aria-label="Haber"
                [ngModel]="l.haber"
                (ngModelChange)="campo(i, 'haber', $event)"
              />
            </td>
            <td><button class="btn btn-ghost" type="button" (click)="quitar(i)">Quitar</button></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="flex gap-3 items-center flex-wrap">
    <button class="btn btn-secondary" type="button" (click)="agregar()">Añadir línea</button
    ><span>Diferencia: {{ diferencia() | dinero }}</span
    ><button
      class="btn btn-primary"
      type="button"
      [disabled]="ocupado() || !editable()"
      (click)="guardar()"
    >
      Guardar borrador
    </button>
  </div>
</section>
