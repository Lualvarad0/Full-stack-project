<!-- Preguntas -->
<section id="preguntas" class="scroll-mt-6 bg-muted/50 px-6 py-20 md:px-12 lg:px-20">
  <div class="mx-auto max-w-3xl">
    <p class="text-sm font-medium text-primary">Preguntas frecuentes</p>
    <h2 class="titular mt-3 text-4xl text-fg md:text-5xl">
      Lo que <em class="italic">suelen preguntar</em>
    </h2>
    <div class="mt-10 divide-y divide-border rounded-2xl border border-border bg-card">
      @for (p of preguntas; track p.pregunta) {
        <details class="group px-6 py-5">
          <summary
            class="flex cursor-pointer list-none items-center justify-between gap-4 font-medium text-fg"
          >
            {{ p.pregunta }}
            <svg
              lucidePlus
              class="size-4 shrink-0 text-muted-fg transition-transform group-open:rotate-45"
              aria-hidden="true"
            ></svg>
          </summary>
          <p class="mt-3 text-sm leading-relaxed text-muted-fg">{{ p.respuesta }}</p>
        </details>
      }
    </div>
  </div>
</section>
