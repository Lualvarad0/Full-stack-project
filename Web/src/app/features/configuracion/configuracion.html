<app-titulo linea1="Configura" linea2="tu cuenta" />

@if (cartera.propio()) { <app-perfil-formulario /> }
@else { <p class="card mt-4 max-w-3xl p-5 text-sm">Estás trabajando con un contribuyente autorizado. Su perfil, firma y buzón los configura el titular; selecciona tu propia cuenta para revisar tu configuración personal.</p> }
<app-seguridad-cuenta class="mt-4 block max-w-3xl" />

<app-plan-tarjeta class="mt-4 block max-w-3xl" />

@if (cartera.propio()) {
<div id="facturacion" class="mt-4 grid max-w-3xl scroll-mt-20 gap-4">
  <app-firma-tarjeta />
  <app-datos-emisor-tarjeta />
</div>

<app-buzon-tarjeta class="mt-4 block" />
}
<app-actividad-cuenta class="mt-4 block max-w-3xl" />

<section class="card mt-4 max-w-3xl p-5 sm:p-6" aria-labelledby="titulo-apariencia">
  <h2 id="titulo-apariencia" class="font-semibold">Apariencia</h2>
  <app-segmentado
    class="mt-4 block"
    [opciones]="temas"
    [(valor)]="preferencias.tema"
    etiqueta="Tema"
  />
</section>
