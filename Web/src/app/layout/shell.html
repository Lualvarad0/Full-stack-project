<div class="min-h-dvh lg:flex">
  <!-- Fondo del menú en móvil -->
  @if (menuAbierto()) {
    <div
      class="fixed inset-0 z-30 bg-black/40 lg:hidden"
      (click)="menuAbierto.set(false)"
      aria-hidden="true"
    ></div>
  }

  <!-- Menú lateral -->
  <app-sidebar [menuAbierto]="menuAbierto()" (cerrar)="menuAbierto.set(false)" />

  <!-- Contenido -->
  <div class="flex min-w-0 flex-1 flex-col">
    <app-header [menuAbierto]="menuAbierto()" (abrir)="menuAbierto.set(true)" />

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 sm:py-8">
      <router-outlet />
    </main>
  </div>
</div>

<app-avisos />
<app-fecha-nacimiento-modal [abierto]="!!auth.usuario()?.faltaFechaNacimiento" />
